services:
  postgres:
    image: postgres:16-alpine
    container_name: minihub-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minihub_car}
      POSTGRES_USER: ${POSTGRES_USER:-minihub_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MiniHubCar_SuperSenhaPostgres_2026}
    volumes:
      - minihub_pg_data:/var/lib/postgresql/data
    ports:
      # Porta 5434 no host para evitar conflito com outros bancos (como ativoarboreo)
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minihub_admin} -d ${POSTGRES_DB:-minihub_car}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: minihub-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3333
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-minihub_admin}:${POSTGRES_PASSWORD:-MiniHubCar_SuperSenhaPostgres_2026}@minihub-postgres:5432/${POSTGRES_DB:-minihub_car}
      JWT_SECRET: ${JWT_SECRET:-minihub-collector-jwt-secret-prod-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-minihub-collector-refresh-secret-prod-2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://minihubcar.com.br}
      STORAGE_LOCAL_PATH: ./uploads
      DONATION_PIX_KEY: ${DONATION_PIX_KEY:-5accf9cd-a478-4e40-a223-a3fbff42b868}
      DONATION_MONTHLY_GOAL: ${DONATION_MONTHLY_GOAL:-110.00}
      EVOLUTION_API_URL: http://minihub-evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-minihub-evolution-secret-key-2026}
      EVOLUTION_INSTANCE_NAME: minihubcar
      ADMIN_WHATSAPP_PHONE: ${ADMIN_WHATSAPP_PHONE:-}
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./catalogos:/app/catalogos:ro
    ports:
      # Porta 3334 no host para a API do MiniHub Car
      - "127.0.0.1:3334:3333"
    networks:
      - default
      - eco_eco-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: minihub-frontend
    restart: always
    depends_on:
      - backend
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: http://minihub-backend:3333
    ports:
      # Porta 3002 no host (evita qualquer conflito caso ativoarboreo use 3000 ou 3001)
      - "127.0.0.1:3002:3000"
    networks:
      - default
      - eco_eco-network

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.0
    container_name: minihub-evolution
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8088}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-minihub-evolution-secret-key-2026}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-minihub_admin}:${POSTGRES_PASSWORD:-MiniHubCar_SuperSenhaPostgres_2026}@minihub-postgres:5432/${POSTGRES_DB:-minihub_car}?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution-api
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CONFIG_SESSION_PHONE_CLIENT: "Evolution API"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      LOG_LEVEL: "ERROR,WARN,INFO"
      LOG_BAILEYS: "error"
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      # Porta 8088 no host para acesso local e seguro da Evolution API
      - "127.0.0.1:8088:8080"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - default

volumes:
  minihub_pg_data:
  evolution_instances:

networks:
  default:
  eco_eco-network:
    external: true
