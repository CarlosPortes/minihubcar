<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.3" />

  <!-- Accent Circle Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" opacity="0.15" />
  <circle cx="256" cy="256" r="180" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Sports Car Silhouette -->
  <!-- Main Body -->
  <path d="M96 288 C96 270, 115 256, 140 256 L180 256 L220 200 C235 180, 260 176, 310 176 L360 176 C390 176, 405 190, 420 220 L445 270 C455 280, 460 295, 460 310 L460 326 C460 336, 452 344, 442 344 L415 344 C410 315, 385 292, 355 292 C325 292, 300 315, 295 344 L217 344 C212 315, 187 292, 157 292 C127 292, 102 315, 97 344 L80 344 C69 344, 60 335, 60 324 L60 310 C60 298, 76 288, 96 288 Z" fill="url(#carGrad)" />

  <!-- Windshield and Windows -->
