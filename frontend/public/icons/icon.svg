  <path d="M298 208 L355 208 C375 208, 385 218, 396 238 L405 252 L298 252 Z" fill="#bfdbfe" opacity="0.9" />

  <!-- Rear Wing Spoiler -->
  <path d="M72 250 L108 250 L104 262 L68 262 Z" fill="#60a5fa" />
  <rect x="98" y="260" width="6" height="26" fill="#3b82f6" />

  <!-- Left Wheel -->
  <circle cx="157" cy="344" r="38" fill="#0f172a" stroke="#334155" stroke-width="4" />
  <circle cx="157" cy="344" r="22" fill="#1e293b" />
  <circle cx="157" cy="344" r="14" fill="#ef4444" />
  <circle cx="157" cy="344" r="6" fill="#ffffff" />

  <!-- Right Wheel -->
  <circle cx="355" cy="344" r="38" fill="#0f172a" stroke="#334155" stroke-width="4" />
  <circle cx="355" cy="344" r="22" fill="#1e293b" />
  <circle cx="355" cy="344" r="14" fill="#ef4444" />
  <circle cx="355" cy="344" r="6" fill="#ffffff" />

  <!-- Headlight beam -->
  <path d="M440 286 L476 292 L476 302 L440 300 Z" fill="#fef08a" opacity="0.9" />
